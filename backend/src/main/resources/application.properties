spring.application.name=PadelBack

spring.datasource.url=jdbc:postgresql://localhost:5432/padel
spring.datasource.username=padel_app
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# JWT admin.
# Dev uniquement : en production, remplacer par une variable d'environnement.
app.jwt.secret=${APP_JWT_SECRET:dev-secret-for-angular-padel-club-admin-jwt-2026}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}