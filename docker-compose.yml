services:
  db:
    image: postgres:16
    container_name: padel-db
    restart: always

    environment:
      POSTGRES_DB: padel
      POSTGRES_USER: padel_app
      POSTGRES_PASSWORD: secret

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  postgres_data: