<div class="p-6 min-w-105">
  <h2 mat-dialog-title class="font-black text-xl text-slate-900">
    {{ data.title }}
  </h2>

  <mat-dialog-content class="text-slate-500 mt-4">
    {{ data.message }}
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="mt-6 flex gap-3">
    <button
      mat-button
      (click)="cancel()"
      class="rounded-xl px-5"
    >
      {{ data.cancelLabel || 'Annuler' }}
    </button>

    <button
      mat-flat-button
      color="warn"
      (click)="confirm()"
      class="rounded-xl px-5"
    >
      {{ data.confirmLabel || 'Confirmér' }}
    </button>
  </mat-dialog-actions>
</div>
