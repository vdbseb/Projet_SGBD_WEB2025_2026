<div class="p-6 min-w-[320px]">
  <h2 class="text-xl font-bold mb-4">
    {{ isAdminMode() ? 'Connexion administrateur' : 'Connexion membre' }}
  </h2>

  <input
    type="text"
    data-cy="login-input"
    [placeholder]="isAdminMode() ? 'Ex: AG01' : 'Ex: G1234'"
    class="w-full border rounded-lg px-4 py-3 mb-4 uppercase"
    [ngModel]="matricule()"
    (ngModelChange)="matricule.set($event)"
  />

  <button
    data-cy="login-button"
    class="bg-blue-600 text-white px-4 py-2 rounded-lg w-full"
    (click)="login()"
  >
    Se connecter
  </button>
</div>
