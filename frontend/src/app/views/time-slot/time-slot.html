<div class="bg-white rounded-4xl p-8 shadow-sm border border-slate-100 mb-10">

  <h2 class="font-black uppercase tracking-widest text-sm mb-6 text-slate-900">
    2. Choisis ton créneau
  </h2>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    @for (slot of availableSlots(); track slot) {
    <button
      type="button"
      data-cy="time-slot"
      (click)="selectSlot(slot)"
      [disabled]="isSlotDisabled(slot)"
      [class]="isSlotDisabled(slot)
          ? 'bg-slate-100 text-slate-300 cursor-not-allowed opacity-60'
          : isSelected(slot)
            ? 'bg-emerald-500 text-white shadow-lg scale-105'
            : 'bg-white border border-slate-200 text-slate-900 hover:border-slate-900'"
      class="h-20 rounded-2xl font-black uppercase tracking-widest text-xs transition-all"
    >
        <span class="block">
          {{ slot }}
        </span>

      @if (getSlotLabel(slot)) {
      <span class="block mt-1 text-[9px] font-black uppercase tracking-widest opacity-70">
            {{ getSlotLabel(slot) }}
          </span>
      }
    </button>
    }
  </div>

  <p class="text-slate-400 text-xs mt-6 uppercase font-bold tracking-widest">
    Durée match : 1h30 • Pause : 15 min
  </p>

</div>
